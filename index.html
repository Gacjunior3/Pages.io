<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Materiais v2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-entrada: #28a745;
            --color-saida: #dc3545;
            --color-primary: #0d6efd;
        }
        body { 
            padding-top: 20px; 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container { 
            max-width: 400px; 
            margin: 0 auto; 
            padding: 20px; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.1); 
        }
        .app-container { 
            display: none; 
        }
        .preview-image { 
            max-width: 100px; 
            max-height: 100px; 
            margin: 5px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
        }
        .btn-camera { 
            width: 100%; 
            padding: 10px; 
        }
        .toast-container { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1100; 
        }
        .modal-image { 
            max-width: 100%; 
            max-height: 70vh; 
            display: block;
            margin: 0 auto;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .action-buttons { 
            white-space: nowrap; 
        }
        #materialTable { 
            font-size: 14px; 
        }
        .table-responsive { 
            overflow-x: auto; 
        }
        .badge-entrada { 
            background-color: var(--color-entrada); 
        }
        .badge-saida { 
            background-color: var(--color-saida); 
        }
        .filter-section { 
            background-color: #f8f9fa; 
            padding: 15px; 
            border-radius: 5px; 
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            border-bottom: 3px solid var(--color-primary);
        }
        .card-header {
            font-weight: 600;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .loading-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            vertical-align: text-bottom;
            border: 0.25em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginContainer" class="container login-container">
        <div class="text-center mb-4">
            <i class="fas fa-boxes fa-3x mb-3" style="color: var(--color-primary);"></i>
            <h2>Controle de Materiais</h2>
        </div>
        <div id="loginAlert" class="alert alert-danger d-none"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
    </div>

    <!-- Aplicativo Principal -->
    <div id="appContainer" class="container app-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">
                <i class="fas fa-boxes me-2" style="color: var(--color-primary);"></i>
                Controle de Materiais
            </h2>
            <button id="logoutBtn" class="btn btn-outline-danger">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>

        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="movimentacao-tab" data-bs-toggle="tab" data-bs-target="#movimentacao" type="button" role="tab">
                    <i class="fas fa-exchange-alt me-1"></i> Movimentação
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="consulta-tab" data-bs-toggle="tab" data-bs-target="#consulta" type="button" role="tab">
                    <i class="fas fa-search me-1"></i> Consulta
                </button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Aba de Movimentação -->
            <div class="tab-pane fade show active" id="movimentacao" role="tabpanel">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-plus-circle me-1"></i> Nova Movimentação
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="movimentacaoForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tipoMovimentacao" class="form-label">Tipo*</label>
                                    <select class="form-select" id="tipoMovimentacao" required>
                                        <option value="">Selecione...</option>
                                        <option value="entrada">Entrada</option>
                                        <option value="saida">Saída</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="responsavel" class="form-label">Responsável*</label>
                                    <input type="text" class="form-control" id="responsavel" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="material" class="form-label">Material*</label>
                                    <input type="text" class="form-control" id="material" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="quantidade" class="form-label">Quantidade*</label>
                                    <input type="number" class="form-control" id="quantidade" required min="1">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="notaFiscal" class="form-label">Número da Nota Fiscal</label>
                                    <input type="text" class="form-control" id="notaFiscal">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dataMovimentacao" class="form-label">Data*</label>
                                    <input type="datetime-local" class="form-control" id="dataMovimentacao" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="origem" class="form-label">Origem (para entrada)</label>
                                    <input type="text" class="form-control" id="origem">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="destino" class="form-label">Destino (para saída)</label>
                                    <input type="text" class="form-control" id="destino">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Foto da Nota Fiscal</label>
                                    <button type="button" class="btn btn-primary btn-camera" onclick="document.getElementById('fotoNota').click()">
                                        <i class="fas fa-camera me-1"></i> Capturar
                                    </button>
                                    <input type="file" id="fotoNota" accept="image/*" capture="environment" style="display:none;">
                                    <div id="previewNota" class="mt-2"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Foto do Material</label>
                                    <button type="button" class="btn btn-primary btn-camera" onclick="document.getElementById('fotoMaterial').click()">
                                        <i class="fas fa-camera me-1"></i> Capturar
                                    </button>
                                    <input type="file" id="fotoMaterial" accept="image/*" capture="environment" style="display:none;">
                                    <div id="previewMaterial" class="mt-2"></div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mt-3">
                                <i class="fas fa-save me-1"></i> Registrar Movimentação
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Aba de Consulta -->
            <div class="tab-pane fade" id="consulta" role="tabpanel">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-1"></i> Consulta de Movimentações
                        </h5>
                        <button class="btn btn-sm btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#filtrosCollapse">
                            <i class="fas fa-filter me-1"></i> Filtros
                        </button>
                    </div>
                    <div class="card-body">
                        <!-- Seção de Filtros -->
                        <div class="collapse show" id="filtrosCollapse">
                            <div class="filter-section">
                                <div class="row g-3">
                                    <div class="col-md-3">
                                        <label for="filtroTipo" class="form-label">Tipo</label>
                                        <select class="form-select" id="filtroTipo">
                                            <option value="">Todos</option>
                                            <option value="entrada">Entrada</option>
                                            <option value="saida">Saída</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filtroMaterial" class="form-label">Material</label>
                                        <input type="text" class="form-control" id="filtroMaterial" placeholder="Pesquisar...">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filtroResponsavel" class="form-label">Responsável</label>
                                        <input type="text" class="form-control" id="filtroResponsavel" placeholder="Pesquisar...">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filtroNotaFiscal" class="form-label">Nota Fiscal</label>
                                        <input type="text" class="form-control" id="filtroNotaFiscal" placeholder="Pesquisar...">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filtroDataInicio" class="form-label">Data Início</label>
                                        <input type="date" class="form-control" id="filtroDataInicio">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filtroDataFim" class="form-label">Data Fim</label>
                                        <input type="date" class="form-control" id="filtroDataFim">
                                    </div>
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button id="aplicarFiltros" class="btn btn-primary w-100">
                                            <i class="fas fa-search me-1"></i> Aplicar
                                        </button>
                                    </div>
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button id="limparFiltros" class="btn btn-secondary w-100">
                                            <i class="fas fa-broom me-1"></i> Limpar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tabela de Resultados -->
                        <div class="table-responsive mt-3">
                            <table class="table table-striped table-hover" id="materialTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Tipo</th>
                                        <th>Data</th>
                                        <th>Material</th>
                                        <th>Qtd</th>
                                        <th>Responsável</th>
                                        <th>Nota Fiscal</th>
                                        <th>Origem/Destino</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="materialTableBody">
                                    <!-- Dados serão carregados aqui -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Visualizar Fotos -->
    <div class="modal fade" id="fotosModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-images me-1"></i> Fotos da Movimentação
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3" id="fotoNotaContainer">
                            <h6 class="text-center fw-bold">
                                <i class="fas fa-file-invoice me-1"></i> Nota Fiscal
                            </h6>
                            <img id="modalFotoNota" class="modal-image img-thumbnail" src="" alt="Foto da Nota Fiscal">
                        </div>
                        <div class="col-md-6 mb-3" id="fotoMaterialContainer">
                            <h6 class="text-center fw-bold">
                                <i class="fas fa-box-open me-1"></i> Material
                            </h6>
                            <img id="modalFotoMaterial" class="modal-image img-thumbnail" src="" alt="Foto do Material">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i> Fechar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Confirmar Exclusão -->
    <div class="modal fade" id="confirmarExclusaoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-exclamation-triangle me-1"></i> Confirmar Exclusão
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Tem certeza que deseja excluir esta movimentação?</p>
                    <div class="mb-3">
                        <label for="senhaAdmin" class="form-label">
                            <i class="fas fa-lock me-1"></i> Senha de Administrador
                        </label>
                        <input type="password" class="form-control" id="senhaAdmin" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i> Cancelar
                    </button>
                    <button type="button" id="confirmarExclusaoBtn" class="btn btn-danger">
                        <i class="fas fa-trash me-1"></i> Confirmar Exclusão
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">
                    <i class="fas fa-info-circle me-1"></i> Notificação
                </strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBm0t_SQ1vyq2fW3aFqgKph-NB9BwCq60Y",
            authDomain: "controle-materiais-v2.firebaseapp.com",
            projectId: "controle-materiais-v2",
            storageBucket: "controle-materiais-v2.firebasestorage.app",
            messagingSenderId: "1059762022447",
            appId: "1:1059762022447:web:a977debad4cbc9ae313eda"
        };

        // Inicialização do Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Variáveis globais
        let currentUser = null;
        let fotoNotaFile = null;
        let fotoMaterialFile = null;
        let movimentacaoAtual = null;
        const SENHA_ADMIN = "admin123"; // Altere para sua senha
        let todasMovimentacoes = [];

        $(document).ready(function() {
            // Configuração do Toast
            const toastEl = document.getElementById('liveToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });

            function showToast(title, message, type = 'success') {
                $('#toastTitle').html(`<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-1"></i> ${title}`);
                $('#toastMessage').text(message);
                $('.toast-header').removeClass('bg-success bg-danger bg-warning').addClass(`bg-${type}`);
                toast.show();
            }

            // Verificação de autenticação
            auth.onAuthStateChanged(user => {
                console.log("Status de autenticação:", user);
                currentUser = user;
                if (user) {
                    $('#loginContainer').hide();
                    $('#appContainer').show();
                    carregarMovimentacoes();
                } else {
                    $('#loginContainer').show();
                    $('#appContainer').hide();
                }
            });

            // Login
            $('#loginForm').submit(function(e) {
                e.preventDefault();
                const email = $('#email').val();
                const password = $('#password').val();
                
                $('#loginAlert').addClass('d-none');
                
                auth.signInWithEmailAndPassword(email, password)
                    .catch(error => {
                        $('#loginAlert').removeClass('d-none').text(error.message);
                    });
            });

            // Logout
            $('#logoutBtn').click(function() {
                auth.signOut();
            });

            // Configuração dos inputs de foto
            $('#fotoNota').change(function(e) {
                fotoNotaFile = e.target.files[0];
                previewImagem(fotoNotaFile, '#previewNota');
            });

            $('#fotoMaterial').change(function(e) {
                fotoMaterialFile = e.target.files[0];
                previewImagem(fotoMaterialFile, '#previewMaterial');
            });

            // Formulário de movimentação
            $('#movimentacaoForm').submit(async function(e) {
                e.preventDefault();
                
                if (!currentUser) {
                    showToast('Erro', 'Faça login antes de continuar', 'danger');
                    return;
                }

                const tipo = $('#tipoMovimentacao').val();
                const responsavel = $('#responsavel').val();
                const material = $('#material').val();
                const quantidade = $('#quantidade').val();
                const notaFiscal = $('#notaFiscal').val();
                const dataMovimentacao = $('#dataMovimentacao').val();
                const origem = $('#origem').val();
                const destino = $('#destino').val();

                // Validação
                if (!tipo || !responsavel || !material || !quantidade || !dataMovimentacao) {
                    showToast('Atenção', 'Preencha todos os campos obrigatórios', 'warning');
                    return;
                }

                try {
                    // Mostrar loading
                    $('#movimentacaoForm button[type="submit"]').html('<span class="loading-spinner"></span> Salvando...').prop('disabled', true);
                    
                    // Salvar dados principais
                    const docRef = await db.collection('movimentacoes').add({
                        tipo,
                        responsavel,
                        material,
                        quantidade: parseInt(quantidade),
                        notaFiscal: notaFiscal || null,
                        data: firebase.firestore.FieldValue.serverTimestamp(),
                        origem: tipo === 'entrada' ? origem : null,
                        destino: tipo === 'saida' ? destino : null,
                        usuario: currentUser.email,
                        criadoEm: new Date().toISOString()
                    });

                    // Upload das fotos
                    const uploadTasks = [];
                    if (fotoNotaFile) {
                        const notaRef = storage.ref(`notas_fiscais/${docRef.id}/${fotoNotaFile.name}`);
                        uploadTasks.push(notaRef.put(fotoNotaFile).then(snapshot => snapshot.ref.getDownloadURL()));
                    } else {
                        uploadTasks.push(Promise.resolve(null));
                    }
                    
                    if (fotoMaterialFile) {
                        const materialRef = storage.ref(`materiais/${docRef.id}/${fotoMaterialFile.name}`);
                        uploadTasks.push(materialRef.put(fotoMaterialFile).then(snapshot => snapshot.ref.getDownloadURL()));
                    } else {
                        uploadTasks.push(Promise.resolve(null));
                    }

                    // Aguardar uploads e atualizar com URLs
                    const [fotoNotaUrl, fotoMaterialUrl] = await Promise.all(uploadTasks);
                    const updateData = {};
                    if (fotoNotaUrl) updateData.fotoNotaUrl = fotoNotaUrl;
                    if (fotoMaterialUrl) updateData.fotoMaterialUrl = fotoMaterialUrl;
                    
                    if (Object.keys(updateData).length > 0) {
                        await docRef.update(updateData);
                    }

                    showToast('Sucesso', 'Movimentação registrada com sucesso!', 'success');
                    
                    // Limpar formulário
                    $('#movimentacaoForm')[0].reset();
                    $('#previewNota, #previewMaterial').empty();
                    fotoNotaFile = fotoMaterialFile = null;
                    
                    // Recarregar dados
                    carregarMovimentacoes();
                    
                } catch (error) {
                    console.error('Erro:', error);
                    showToast('Erro', 'Falha ao registrar movimentação: ' + error.message, 'danger');
                } finally {
                    $('#movimentacaoForm button[type="submit"]').html('<i class="fas fa-save me-1"></i> Registrar Movimentação').prop('disabled', false);
                }
            });

            // Configuração da exclusão
            $('#confirmarExclusaoBtn').click(async function() {
                const senha = $('#senhaAdmin').val();
                if (senha !== SENHA_ADMIN) {
                    showToast('Erro', 'Senha de administrador incorreta', 'danger');
                    return;
                }

                try {
                    $(this).html('<span class="loading-spinner"></span> Excluindo...').prop('disabled', true);
                    
                    // Exclui do Firestore
                    await db.collection('movimentacoes').doc(movimentacaoAtual.id).delete();
                    
                    // Exclui as fotos do Storage (se existirem)
                    const deletions = [];
                    if (movimentacaoAtual.fotoNotaUrl) {
                        const notaRef = storage.refFromURL(movimentacaoAtual.fotoNotaUrl);
                        deletions.push(notaRef.delete());
                    }
                    if (movimentacaoAtual.fotoMaterialUrl) {
                        const materialRef = storage.refFromURL(movimentacaoAtual.fotoMaterialUrl);
                        deletions.push(materialRef.delete());
                    }

                    await Promise.all(deletions);
                    showToast('Sucesso', 'Movimentação excluída com sucesso', 'success');
                    $('#confirmarExclusaoModal').modal('hide');
                    carregarMovimentacoes();
                    
                } catch (error) {
                    showToast('Erro', 'Falha ao excluir: ' + error.message, 'danger');
                } finally {
                    $(this).html('<i class="fas fa-trash me-1"></i> Confirmar Exclusão').prop('disabled', false);
                }
            });

            // Event Listeners para filtros
            $('#aplicarFiltros').click(aplicarFiltros);
            $('#limparFiltros').click(function() {
                $('#filtroTipo, #filtroMaterial, #filtroResponsavel, #filtroNotaFiscal, #filtroDataInicio, #filtroDataFim').val('');
                aplicarFiltros();
            });
            
            // Aplicar filtro ao pressionar Enter
            $('.form-control').keypress(function(e) {
                if (e.which === 13) aplicarFiltros();
            });

            // Carrega a data atual
            const now = new Date();
            const timezoneOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - timezoneOffset).toISOString().slice(0, 16);
            $('#dataMovimentacao').val(localISOTime);
        });

        // Função para carregar movimentações
        async function carregarMovimentacoes() {
            try {
                showLoading(true);
                
                const snapshot = await db.collection('movimentacoes')
                    .orderBy('data', 'desc')
                    .get();

                todasMovimentacoes = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    todasMovimentacoes.push(data);
                });

                aplicarFiltros();
            } catch (error) {
                console.error("Erro ao carregar:", error);
                showToast('Erro', 'Falha ao carregar movimentações: ' + error.message, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Função para aplicar filtros
        function aplicarFiltros() {
            const tipo = $('#filtroTipo').val().toLowerCase();
            const material = $('#filtroMaterial').val().toLowerCase();
            const responsavel = $('#filtroResponsavel').val().toLowerCase();
            const notaFiscal = $('#filtroNotaFiscal').val().toLowerCase();
            const dataInicio = $('#filtroDataInicio').val();
            const dataFim = $('#filtroDataFim').val();

            const resultados = todasMovimentacoes.filter(mov => {
                // Filtro por tipo
                if (tipo && mov.tipo !== tipo) return false;
                
                // Filtro por material
                if (material && !mov.material.toLowerCase().includes(material)) return false;
                
                // Filtro por responsável
                if (responsavel && !mov.responsavel.toLowerCase().includes(responsavel)) return false;
                
                // Filtro por nota fiscal
                if (notaFiscal && (!mov.notaFiscal || !mov.notaFiscal.toLowerCase().includes(notaFiscal))) return false;
                
                // Filtro por data
                const dataMov = mov.data?.toDate() || new Date(mov.criadoEm);
                if (dataInicio && new Date(dataInicio) > dataMov) return false;
                if (dataFim) {
                    const fim = new Date(dataFim);
                    fim.setDate(fim.getDate() + 1); // Inclui o dia inteiro
                    if (fim < dataMov) return false;
                }
                
                return true;
            });

            exibirResultados(resultados);
        }

        // Função para exibir resultados na tabela
        function exibirResultados(dados) {
            const tbody = $('#materialTableBody');
            tbody.empty();

            if (dados.length === 0) {
                tbody.append('<tr><td colspan="8" class="text-center py-4 text-muted">Nenhuma movimentação encontrada</td></tr>');
                return;
            }

            dados.forEach(mov => {
                const dataFormatada = formatarData(mov.data?.toDate() || new Date(mov.criadoEm));
                const origemDestino = mov.tipo === 'entrada' ? 
                    `<span class="text-success"><i class="fas fa-arrow-down me-1"></i> ${mov.origem || '-'}</span>` : 
                    `<span class="text-danger"><i class="fas fa-arrow-up me-1"></i> ${mov.destino || '-'}</span>`;
                
                tbody.append(`
                    <tr>
                        <td><span class="badge ${mov.tipo === 'entrada' ? 'badge-entrada' : 'badge-saida'}">${mov.tipo === 'entrada' ? 'Entrada' : 'Saída'}</span></td>
                        <td>${dataFormatada}</td>
                        <td>${mov.material}</td>
                        <td>${mov.quantidade}</td>
                        <td>${mov.responsavel}</td>
                        <td>${mov.notaFiscal || '-'}</td>
                        <td>${origemDestino}</td>
                        <td class="action-buttons">
                            <button class="btn btn-sm btn-info" onclick="verFotosCompletas('${mov.id}')" title="Ver Fotos" data-bs-toggle="tooltip">
                                <i class="fas fa-images"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="prepararExclusao('${mov.id}')" title="Excluir" data-bs-toggle="tooltip">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `);
            });

            // Inicializar tooltips
            $('[data-bs-toggle="tooltip"]').tooltip();
        }

        // Função para formatar data
        function formatarData(data) {
            const options = { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            };
            return data.toLocaleDateString('pt-BR', options);
        }

        // Função para mostrar loading
        function showLoading(show) {
            const tbody = $('#materialTableBody');
            if (show) {
                tbody.html('<tr><td colspan="8" class="text-center py-4"><div class="loading-spinner text-primary"></div> <span class="ms-2">Carregando...</span></td></tr>');
            }
        }

        // Função para pré-visualizar imagens
        function previewImagem(file, seletor) {
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    $(seletor).html(`<img src="${e.target.result}" class="preview-image">`);
                };
                reader.readAsDataURL(file);
            } else {
                $(seletor).empty();
            }
        }

        // Funções globais para acesso nos botões
        window.verFotosCompletas = async function(id) {
            try {
                showLoading(true);
                const doc = await db.collection('movimentacoes').doc(id).get();
                if (!doc.exists) return;

                const data = doc.data();
                const modal = new bootstrap.Modal(document.getElementById('fotosModal'));
                
                // Foto da nota fiscal
                const notaContainer = $('#fotoNotaContainer');
                const notaImg = $('#modalFotoNota');
                if (data.fotoNotaUrl) {
                    notaImg.attr('src', data.fotoNotaUrl);
                    notaContainer.show();
                } else {
                    notaContainer.hide();
                }
                
                // Foto do material
                const materialContainer = $('#fotoMaterialContainer');
                const materialImg = $('#modalFotoMaterial');
                if (data.fotoMaterialUrl) {
                    materialImg.attr('src', data.fotoMaterialUrl);
                    materialContainer.show();
                } else {
                    materialContainer.hide();
                }
                
                modal.show();
            } catch (error) {
                showToast('Erro', 'Não foi possível carregar as fotos', 'danger');
            } finally {
                showLoading(false);
            }
        };

        window.prepararExclusao = async function(id) {
            try {
                showLoading(true);
                const doc = await db.collection('movimentacoes').doc(id).get();
                if (!doc.exists) return;

                movimentacaoAtual = {
                    id: doc.id,
                    ...doc.data()
                };

                $('#senhaAdmin').val('');
                new bootstrap.Modal(document.getElementById('confirmarExclusaoModal')).show();
            } catch (error) {
                showToast('Erro', 'Falha ao preparar exclusão', 'danger');
            } finally {
                showLoading(false);
            }
        };

        // Debug inicial
        console.log("Aplicação iniciada");
        if (!firebase.apps.length) {
            console.error("Firebase não foi inicializado corretamente");
        } else {
            console.log("Firebase inicializado com sucesso");
        }
    </script>
</body>
</html>
