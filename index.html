<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Retirada/Entrega</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @media screen {
            body {
                font-family: Arial, sans-serif;
                background-color: black;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }
            
            .form-container {
                background-color: white;
                border-radius: 5px;
                box-shadow: 0 0 20px rgba(255,255,255,0.3);
                width: 100%;
                max-width: 800px;
                padding: 25px;
                box-sizing: border-box;
            }
        }
        
        @media print {
            body {
                background: white !important;
                padding: 0;
                margin: 0;
            }
            
            .form-container {
                border: none;
                box-shadow: none;
                padding: 0;
                width: 100%;
                height: 100%;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
        }
        
        h1 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            color: #000;
        }
        
        h3 {
            font-size: 14px;
            margin: 12px 0 8px;
            color: #000;
            border-bottom: 1px solid #eee;
            padding-bottom: 3px;
        }
        
        .form-group {
            margin-bottom: 8px;
        }
        
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
            font-weight: bold;
            color: #000;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 12px;
            background-color: #fff;
        }
        
        textarea {
            height: 50px;
            resize: none;
        }
        
        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 5px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .signature-area {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
        
        .signature-box {
            width: 45%;
            text-align: center;
        }
        
        .signature-line {
            border-top: 1px solid #000;
            margin: 30px 0 5px;
        }
        
        .no-print {
            text-align: center;
            margin-top: 15px;
        }
        
        button {
            padding: 8px 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .required-field::after {
            content: " *";
            color: red;
        }
        
        #placa {
            text-transform: uppercase;
            font-family: monospace;
            letter-spacing: 1px;
        }
        
        /* Garante que tudo caiba em uma página A4 */
        @page {
            size: A4;
            margin: 0;
        }
        
        .form-container {
            height: 280mm; /* Altura aproximada de uma A4 */
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="form-container" id="form-to-print">
        <h1>FORMULÁRIO DE RETIRADA/ENTREGA - Nº <span id="doc-number-display"></span></h1>
        
        <form id="main-form">
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="cliente_nome" class="required-field">Cliente:</label>
                    <input type="text" id="cliente_nome" name="cliente_nome" required>
                </div>
                <div class="form-group">
                    <label for="data" class="required-field">Data:</label>
                    <input type="date" id="data" name="data" required>
                </div>
                <div class="form-group">
                    <label for="tipo_operacao" class="required-field">Operação:</label>
                    <select id="tipo_operacao" name="tipo_operacao" required>
                        <option value="">Selecione</option>
                        <option value="retirada">Retirada</option>
                        <option value="entrega">Entrega</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="document_number" class="required-field">Nº Documento:</label>
                    <input type="text" id="document_number" name="document_number" required readonly>
                </div>
                <div class="form-group">
                    <label for="nota" class="required-field">Nota Fiscal:</label>
                    <input type="text" id="nota" name="nota" required>
                </div>
                <div class="form-group">
                    <label for="consultor" class="required-field">Consultor:</label>
                    <input type="text" id="consultor" name="consultor" required>
                </div>
            </div>
            
            <h3>Dados do Veículo</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="placa" class="required-field">Placa:</label>
                    <input type="text" id="placa" name="placa" required placeholder="AAA0A00 ou AAA0000" maxlength="7" pattern="[A-Z]{3}[0-9][A-Z0-9][0-9]{2}">
                </div>
                <div class="form-group">
                    <label for="modelo" class="required-field">Modelo:</label>
                    <select id="modelo" name="modelo" required>
                        <option value="">Selecione</option>
                        <option value="Toco">Toco</option>
                        <option value="Carreta">Carreta</option>
                        <option value="Carreta LS">Carreta LS</option>
                        <option value="Caminhonete">Caminhonete</option>
                        <option value="Caminhão Baú">Caminhão Baú</option>
                        <option value="Carreta Baú">Carreta Baú</option>
                        <option value="Caminhão Munck">Caminhão Munck</option>
                        <option value="Bitrem">Bitrem</option>
                        <option value="Rodotrem">Rodotrem</option>
                        <option value="Van">Van</option>
                        <option value="Truck">Truck</option>
                        <option value="Bitruck">Bitruck</option>
                    </select>
                </div>
            </div>
            
            <h3>Dados do Motorista</h3>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="motorista_nome" class="required-field">Nome:</label>
                    <input type="text" id="motorista_nome" name="motorista_nome" required>
                </div>
                <div class="form-group">
                    <label for="motorista_cpf" class="required-field">CPF:</label>
                    <input type="text" id="motorista_cpf" name="motorista_cpf" required placeholder="000.000.000-00">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="motorista_rg" class="required-field">RG:</label>
                    <input type="text" id="motorista_rg" name="motorista_rg" required>
                </div>
                <div class="form-group">
                    <label for="motorista_cnh" class="required-field">CNH:</label>
                    <input type="text" id="motorista_cnh" name="motorista_cnh" required>
                </div>
            </div>
            
            <h3>Dados da Carga</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="tipo_material" class="required-field">Tipo Material:</label>
                    <select id="tipo_material" name="tipo_material" required>
                        <option value="">Selecione</option>
                        <option value="pecas">Peças</option>
                        <option value="equipamentos">Equipamentos</option>
                        <option value="materiais">Materiais de Construção</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantidade" class="required-field">Quantidade:</label>
                    <input type="number" id="quantidade" name="quantidade" required min="1">
                </div>
            </div>
            
            <h3>Destino</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="estado" class="required-field">Estado:</label>
                    <select id="estado" name="estado" required onchange="carregarCidades()">
                        <option value="">Selecione</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AP">AP</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MT">MT</option>
                        <option value="MS">MS</option>
                        <option value="MG">MG</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PR">PR</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RS">RS</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="SC">SC</option>
                        <option value="SP">SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cidade" class="required-field">Cidade:</label>
                    <select id="cidade" name="cidade" required disabled>
                        <option value="">Selecione estado</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="endereco" class="required-field">Endereço Completo:</label>
                <textarea id="endereco" name="endereco" required placeholder="Rua, número, bairro"></textarea>
            </div>
            
            <div class="form-group">
                <label for="observacoes">Observações:</label>
                <textarea id="observacoes" name="observacoes" placeholder="Informações adicionais"></textarea>
            </div>
            
            <div class="signature-area">
                <div class="signature-box">
                    <div class="signature-line"></div>
                    <p>Assinatura do Motorista</p>
                </div>
                <div class="signature-box">
                    <div class="signature-line"></div>
                    <p>Responsável pelo Recebimento</p>
                </div>
            </div>
            
            <div class="no-print">
                <button type="button" onclick="saveAndPrint()">Imprimir/Salvar PDF</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Data automática
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            document.getElementById('data').value = dateStr;
            
            // Gerar número do documento
            generateDocumentNumber();
            
            // Máscara para CPF
            document.getElementById('motorista_cpf').addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                
                if (value.length > 3) value = value.replace(/^(\d{3})(\d)/, '$1.$2');
                if (value.length > 6) value = value.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
                if (value.length > 9) value = value.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
                e.target.value = value.substring(0, 14);
            });
            
            // Máscara para placa do veículo (aceita padrão novo e antigo)
            document.getElementById('placa').addEventListener('input', function(e) {
                let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                
                // Padrão novo: AAA0A00
                if (/^[A-Z]{3}\d[A-Z]\d{2}$/.test(value)) {
                    if (value.length > 3) value = value.substring(0, 3) + value.substring(3, 4) + 
                                                (value.length > 4 ? value.substring(4, 5) : '') + 
                                                (value.length > 5 ? value.substring(5, 7) : '');
                    e.target.value = value.substring(0, 7);
                } 
                // Padrão antigo: AAA0000
                else {
                    if (value.length > 3) value = value.substring(0, 3) + value.substring(3);
                    e.target.value = value.substring(0, 7);
                }
            });
            
            // Validação da placa ao sair do campo
            document.getElementById('placa').addEventListener('blur', function(e) {
                const value = e.target.value.replace(/-/g, '');
                // Verifica se é placa no padrão novo (AAA0A00) ou antigo (AAA0000)
                if (!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(value) || value.length !== 7) {
                    alert('Placa inválida! Formato correto: AAA0A00 (novo) ou AAA0000 (antigo)');
                    e.target.focus();
                }
            });
            
            // Monitorar tipo de operação para cidade
            document.getElementById('tipo_operacao').addEventListener('change', function() {
                if (this.value === 'entrega') {
                    document.getElementById('cidade').innerHTML = '<option value="Galpão">Galpão</option>';
                    document.getElementById('cidade').disabled = false;
                    document.getElementById('estado').disabled = true;
                    document.getElementById('estado').value = '';
                } else {
                    document.getElementById('estado').disabled = false;
                    const estado = document.getElementById('estado').value;
                    if (estado) carregarCidades();
                }
            });
        });

        function generateDocumentNumber() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            const docNumber = `${year}${month}-${randomNum}`;
            
            document.getElementById('document_number').value = docNumber;
            document.getElementById('doc-number-display').textContent = docNumber;
        }

        function carregarCidades() {
            const estadoSelect = document.getElementById('estado');
            const cidadeSelect = document.getElementById('cidade');
            const siglaEstado = estadoSelect.value;
            
            if (!siglaEstado) {
                cidadeSelect.disabled = true;
                cidadeSelect.innerHTML = '<option value="">Selecione estado</option>';
                return;
            }
            
            cidadeSelect.disabled = true;
            cidadeSelect.innerHTML = '<option value="">Carregando...</option>';
            
            fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${siglaEstado}/municipios`)
                .then(response => response.json())
                .then(cidades => {
                    cidadeSelect.disabled = false;
                    cidadeSelect.innerHTML = '<option value="">Selecione</option>';
                    
                    cidades.sort((a, b) => a.nome.localeCompare(b.nome));
                    
                    cidades.forEach(cidade => {
                        const option = document.createElement('option');
                        option.value = cidade.nome;
                        option.textContent = cidade.nome;
                        cidadeSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Erro ao carregar cidades:', error);
                    cidadeSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                });
        }

        function saveAsPDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('form-to-print');
            const docNumber = document.getElementById('document_number').value || 'documento';
            const clienteNome = document.getElementById('cliente_nome').value || 'cliente';
            const fileName = `DOC-${docNumber}_${clienteNome.replace(/\s+/g, '_')}.pdf`;
            
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });
            
            html2canvas(element, {
                scale: 2,
                logging: false,
                useCORS: true,
                windowHeight: element.scrollHeight,
                onclone: function(clonedDoc) {
                    // Remove as setas dos inputs numéricos no clone para impressão
                    const numberInputs = clonedDoc.querySelectorAll('input[type="number"]');
                    numberInputs.forEach(input => {
                        input.style.webkitAppearance = 'none';
                        input.style.mozAppearance = 'textfield';
                    });
                }
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const imgWidth = 210;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save(fileName);
            });
        }

        function saveAndPrint() {
            // Validação do formulário antes de salvar
            if (!document.getElementById('main-form').checkValidity()) {
                alert('Por favor, preencha todos os campos obrigatórios corretamente antes de imprimir.');
                return;
            }
            
            // Primeiro salva como PDF
            saveAsPDF();
            
            // Depois abre a janela de impressão
            setTimeout(() => {
                window.print();
            }, 1000);
        }
    </script>
</body>
</html>
