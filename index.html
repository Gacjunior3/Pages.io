
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema GAC - Leitor de Texto em Imagens</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --warning-color: #f72585;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--dark-color);
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            font-size: 1.8rem;
        }
        
        .logo h1 {
            font-weight: 600;
            font-size: 1.5rem;
        }
        
        .version {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        main {
            padding: 2rem;
        }
        
        .upload-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 2rem;
            margin-top: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: rgba(67, 97, 238, 0.05);
        }
        
        .upload-area i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        .upload-area p {
            margin-bottom: 0.5rem;
        }
        
        .upload-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 1rem;
            border-radius: 8px;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        
        .control-group {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        select, button {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: inherit;
            font-size: 1rem;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress-container {
            width: 100%;
            background-color: #f1f1f1;
            border-radius: 8px;
            margin: 1rem 0;
            display: none;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 20px;
            background: linear-gradient(to right, var(--accent-color), var(--success-color));
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: white;
        }
        
        .result-section {
            margin-top: 2rem;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .result-header h3 {
            font-size: 1.2rem;
        }
        
        .copy-btn {
            background-color: var(--light-color);
            color: var(--dark-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .copy-btn:hover {
            background-color: #e9ecef;
        }
        
        #result {
            padding: 1.5rem;
            background-color: var(--light-color);
            border-radius: 8px;
            min-height: 200px;
            white-space: pre-wrap;
            border: 1px solid #eee;
        }
        
        footer {
            text-align: center;
            padding: 1rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-eye"></i>
                <h1>Sistema GAC</h1>
            </div>
            <span class="version">v1.0</span>
        </header>
        
        <main>
            <section class="upload-section">
                <h2>Leitor de Texto em Imagens</h2>
                <p>Converta imagens com texto em texto editável automaticamente</p>
                
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p><strong>Clique para selecionar uma imagem</strong></p>
                    <p>ou arraste e solte o arquivo aqui</p>
                    <input type="file" id="imageUpload" accept="image/*">
                </div>
                <img id="imagePreview" alt="Pré-visualização da imagem">
            </section>
            
            <div class="controls">
                <div class="control-group">
                    <label for="language">Idioma do texto:</label>
                    <select id="language" class="language-selector">
                        <option value="eng">Inglês</option>
                        <option value="por" selected>Português</option>
                        <option value="spa">Espanhol</option>
                        <option value="fra">Francês</option>
                        <option value="deu">Alemão</option>
                        <option value="ita">Italiano</option>
                        <option value="chi_sim">Chinês Simplificado</option>
                        <option value="jpn">Japonês</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="engine">Motor OCR:</label>
                    <select id="engine">
                        <option value="tesseract">Tesseract.js (Local)</option>
                        <option value="ocrspace">OCR.space (Online)</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>&nbsp;</label>
                    <button id="extractBtn" disabled>
                        <i class="fas fa-magic"></i> Extrair Texto
                    </button>
                </div>
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
            
            <section class="result-section">
                <div class="result-header">
                    <h3>Texto Extraído:</h3>
                    <button class="copy-btn" id="copyBtn">
                        <i class="far fa-copy"></i> Copiar
                    </button>
                </div>
                <div id="result">O texto extraído da imagem aparecerá aqui...</div>
            </section>
        </main>
        
        <footer>
            <p>Sistema GAC &copy; 2023 - Gestão Automatizada de Conteúdo</p>
        </footer>
    </div>

    <script>
        // Elementos da interface
        const imageUpload = document.getElementById('imageUpload');
        const uploadArea = document.getElementById('uploadArea');
        const imagePreview = document.getElementById('imagePreview');
        const extractBtn = document.getElementById('extractBtn');
        const resultDiv = document.getElementById('result');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const languageSelector = document.getElementById('language');
        const engineSelector = document.getElementById('engine');
        const copyBtn = document.getElementById('copyBtn');
        
        // Mostrar pré-visualização da imagem
        imageUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    extractBtn.disabled = false;
                    
                    // Atualizar área de upload
                    uploadArea.style.borderColor = 'var(--primary-color)';
                    uploadArea.innerHTML = `
                        <i class="fas fa-check-circle"></i>
                        <p><strong>${file.name}</strong></p>
                        <p>${(file.size / 1024).toFixed(2)} KB</p>
                        <input type="file" id="imageUpload" accept="image/*">
                    `;
                }
                reader.readAsDataURL(file);
            }
        });
        
        // Arrastar e soltar
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--primary-color)';
            uploadArea.style.backgroundColor = 'rgba(67, 97, 238, 0.1)';
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#ccc';
            uploadArea.style.backgroundColor = '';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            uploadArea.style.backgroundColor = '';
            
            if (e.dataTransfer.files.length) {
                imageUpload.files = e.dataTransfer.files;
                const event = new Event('change');
                imageUpload.dispatchEvent(event);
            }
        });
        
        // Copiar texto
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultDiv.textContent);
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Copiado!';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="far fa-copy"></i> Copiar';
                }, 2000);
            } catch (err) {
                console.error('Falha ao copiar texto: ', err);
            }
        });
        
        // Processar a imagem
        extractBtn.addEventListener('click', async function() {
            const selectedLanguage = languageSelector.value;
            const selectedEngine = engineSelector.value;
            
            resultDiv.textContent = "Processando imagem...";
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            extractBtn.disabled = true;
            
            try {
                let text;
                
                if (selectedEngine === 'tesseract') {
                    // Usar Tesseract.js
                    const { data: { text: extractedText } } = await Tesseract.recognize(
                        imagePreview.src,
                        selectedLanguage,
                        {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    const progress = Math.round(m.progress * 100);
                                    progressBar.style.width = `${progress}%`;
                                    progressBar.textContent = `${progress}%`;
                                }
                            },
                            tessedit_pageseg_mode: 6,
                            preserve_interword_spaces: '1'
                        }
                    );
                    text = extractedText;
                } else {
                    // Usar OCR.space (API pública)
                    text = await ocrSpaceAPI(imageUpload.files[0], selectedLanguage);
                }
                
                resultDiv.textContent = text;
                progressBar.style.width = '100%';
                progressBar.textContent = '100%';
                
            } catch (err) {
                console.error(err);
                resultDiv.textContent = "Erro: " + err.message;
            } finally {
                extractBtn.disabled = false;
            }
        });
        
        // Função para OCR.space API
        async function ocrSpaceAPI(imageFile, language) {
            const apiKey = 'helloworld'; // Chave pública gratuita
            const formData = new FormData();
            formData.append('file', imageFile);
            formData.append('apikey', apiKey);
            formData.append('language', language);
            formData.append('isOverlayRequired', 'false');
            
            progressBar.textContent = "Enviando para API...";
            
            try {
                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.IsErroredOnProcessing) {
                    throw new Error(data.ErrorMessage || "Erro no processamento");
                }
                
                return data.ParsedResults?.[0]?.ParsedText || "Nenhum texto encontrado";
            } catch (error) {
                throw new Error("Falha na conexão com OCR.space: " + error.message);
            }
        }
    </script>
</body>
</html>
