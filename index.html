<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Materiais v2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .login-container { max-width: 400px; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .app-container { display: none; }
        .preview-image { max-width: 100px; max-height: 100px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        .btn-camera { width: 100%; padding: 10px; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1100; }
        .modal-image { max-width: 100%; max-height: 70vh; }
        .action-buttons { white-space: nowrap; }
        #materialTable { font-size: 14px; }
        .table-responsive { overflow-x: auto; }
    </style>
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginContainer" class="container login-container">
        <h2 class="text-center mb-4">Controle de Materiais</h2>
        <div id="loginAlert" class="alert alert-danger d-none"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>

    <!-- Aplicativo Principal -->
    <div id="appContainer" class="container app-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Controle de Materiais</h2>
            <button id="logoutBtn" class="btn btn-outline-danger">Sair <i class="fas fa-sign-out-alt"></i></button>
        </div>

        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="movimentacao-tab" data-bs-toggle="tab" data-bs-target="#movimentacao" type="button" role="tab">Movimentação</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="consulta-tab" data-bs-toggle="tab" data-bs-target="#consulta" type="button" role="tab">Consulta</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Aba de Movimentação -->
            <div class="tab-pane fade show active" id="movimentacao" role="tabpanel">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Nova Movimentação</h5>
                    </div>
                    <div class="card-body">
                        <form id="movimentacaoForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tipoMovimentacao" class="form-label">Tipo*</label>
                                    <select class="form-select" id="tipoMovimentacao" required>
                                        <option value="">Selecione...</option>
                                        <option value="entrada">Entrada</option>
                                        <option value="saida">Saída</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="responsavel" class="form-label">Responsável*</label>
                                    <input type="text" class="form-control" id="responsavel" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="material" class="form-label">Material*</label>
                                    <input type="text" class="form-control" id="material" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="quantidade" class="form-label">Quantidade*</label>
                                    <input type="number" class="form-control" id="quantidade" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="notaFiscal" class="form-label">Nota Fiscal</label>
                                    <input type="text" class="form-control" id="notaFiscal">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dataMovimentacao" class="form-label">Data*</label>
                                    <input type="datetime-local" class="form-control" id="dataMovimentacao" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="origem" class="form-label">Origem (entrada)</label>
                                    <input type="text" class="form-control" id="origem">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="destino" class="form-label">Destino (saída)</label>
                                    <input type="text" class="form-control" id="destino">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Foto da Nota</label>
                                    <button type="button" class="btn btn-primary btn-camera" onclick="document.getElementById('fotoNota').click()">
                                        <i class="fas fa-camera"></i> Capturar
                                    </button>
                                    <input type="file" id="fotoNota" accept="image/*" capture="environment" style="display:none;">
                                    <div id="previewNota" class="mt-2"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Foto do Material</label>
                                    <button type="button" class="btn btn-primary btn-camera" onclick="document.getElementById('fotoMaterial').click()">
                                        <i class="fas fa-camera"></i> Capturar
                                    </button>
                                    <input type="file" id="fotoMaterial" accept="image/*" capture="environment" style="display:none;">
                                    <div id="previewMaterial" class="mt-2"></div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mt-3">
                                <i class="fas fa-save"></i> Salvar Movimentação
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Aba de Consulta -->
            <div class="tab-pane fade" id="consulta" role="tabpanel">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Movimentações Registradas</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="materialTable">
                                <thead>
                                    <tr>
                                        <th>Tipo</th>
                                        <th>Data</th>
                                        <th>Material</th>
                                        <th>Qtd</th>
                                        <th>Responsável</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="materialTableBody">
                                    <!-- Dados serão carregados aqui -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Visualizar Fotos -->
    <div class="modal fade" id="fotosModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Fotos da Movimentação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div id="fotoNotaContainer">
                        <h6>Nota Fiscal</h6>
                        <img id="modalFotoNota" class="modal-image mb-3" src="">
                    </div>
                    <div id="fotoMaterialContainer">
                        <h6>Material</h6>
                        <img id="modalFotoMaterial" class="modal-image" src="">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Confirmar Exclusão -->
    <div class="modal fade" id="confirmarExclusaoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Tem certeza que deseja excluir esta movimentação?</p>
                    <div class="mb-3">
                        <label for="senhaAdmin" class="form-label">Senha de Administrador</label>
                        <input type="password" class="form-control" id="senhaAdmin" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="confirmarExclusaoBtn" class="btn btn-danger">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">Notificação</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>

    <script>
        // Configuração do Firebase (com seus dados)
        const firebaseConfig = {
            apiKey: "AIzaSyBm0t_SQ1vyq2fW3aFqgKph-NB9BwCq60Y",
            authDomain: "controle-materiais-v2.firebaseapp.com",
            projectId: "controle-materiais-v2",
            storageBucket: "controle-materiais-v2.firebasestorage.app",
            messagingSenderId: "1059762022447",
            appId: "1:1059762022447:web:a977debad4cbc9ae313eda"
        };

        // Inicialização do Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Variáveis globais
        let currentUser = null;
        let fotoNotaFile = null;
        let fotoMaterialFile = null;
        let movimentacaoAtual = null;
        const SENHA_ADMIN = "admin123"; // Altere para sua senha

        $(document).ready(function() {
            // Configuração do Toast
            const toastEl = document.getElementById('liveToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });

            function showToast(title, message, type = 'success') {
                $('#toastTitle').text(title);
                $('#toastMessage').text(message);
                $('.toast-header').removeClass('bg-success bg-danger bg-warning').addClass(`bg-${type}`);
                toast.show();
            }

            // Verificação de autenticação
            auth.onAuthStateChanged(user => {
                console.log("Status de autenticação:", user);
                currentUser = user;
                if (user) {
                    $('#loginContainer').hide();
                    $('#appContainer').show();
                    carregarMovimentacoes();
                } else {
                    $('#loginContainer').show();
                    $('#appContainer').hide();
                }
            });

            // Login
            $('#loginForm').submit(function(e) {
                e.preventDefault();
                const email = $('#email').val();
                const password = $('#password').val();
                
                auth.signInWithEmailAndPassword(email, password)
                    .catch(error => {
                        showToast('Erro', error.message, 'danger');
                    });
            });

            // Logout
            $('#logoutBtn').click(function() {
                auth.signOut();
            });

            // Configuração dos inputs de foto
            $('#fotoNota').change(function(e) {
                fotoNotaFile = e.target.files[0];
                previewImagem(fotoNotaFile, '#previewNota');
            });

            $('#fotoMaterial').change(function(e) {
                fotoMaterialFile = e.target.files[0];
                previewImagem(fotoMaterialFile, '#previewMaterial');
            });

            // Formulário de movimentação
            $('#movimentacaoForm').submit(async function(e) {
                e.preventDefault();
                
                if (!currentUser) {
                    showToast('Erro', 'Faça login antes de continuar', 'danger');
                    return;
                }

                const tipo = $('#tipoMovimentacao').val();
                const responsavel = $('#responsavel').val();
                const material = $('#material').val();
                const quantidade = $('#quantidade').val();
                const notaFiscal = $('#notaFiscal').val();
                const dataMovimentacao = $('#dataMovimentacao').val();
                const origem = $('#origem').val();
                const destino = $('#destino').val();

                // Validação
                if (!tipo || !responsavel || !material || !quantidade || !dataMovimentacao) {
                    showToast('Atenção', 'Preencha todos os campos obrigatórios', 'warning');
                    return;
                }

                try {
                    // Salvar dados principais
                    const docRef = await db.collection('movimentacoes').add({
                        tipo,
                        responsavel,
                        material,
                        quantidade: parseInt(quantidade),
                        notaFiscal: notaFiscal || null,
                        data: firebase.firestore.FieldValue.serverTimestamp(),
                        origem: tipo === 'entrada' ? origem : null,
                        destino: tipo === 'saida' ? destino : null,
                        usuario: currentUser.email,
                        criadoEm: new Date().toISOString()
                    });

                    // Upload das fotos
                    const uploads = [];
                    if (fotoNotaFile) {
                        const notaRef = storage.ref(`notas_fiscais/${docRef.id}/${fotoNotaFile.name}`);
                        uploads.push(notaRef.put(fotoNotaFile));
                    }
                    if (fotoMaterialFile) {
                        const materialRef = storage.ref(`materiais/${docRef.id}/${fotoMaterialFile.name}`);
                        uploads.push(materialRef.put(fotoMaterialFile));
                    }

                    await Promise.all(uploads);
                    showToast('Sucesso', 'Movimentação registrada com sucesso!', 'success');
                    
                    // Limpar formulário
                    $('#movimentacaoForm')[0].reset();
                    $('#previewNota, #previewMaterial').empty();
                    fotoNotaFile = fotoMaterialFile = null;
                    carregarMovimentacoes();

                } catch (error) {
                    console.error('Erro:', error);
                    showToast('Erro', 'Falha ao registrar movimentação', 'danger');
                }
            });

            // Configuração da exclusão
            $('#confirmarExclusaoBtn').click(async function() {
                const senha = $('#senhaAdmin').val();
                if (senha !== SENHA_ADMIN) {
                    showToast('Erro', 'Senha de administrador incorreta', 'danger');
                    return;
                }

                try {
                    // Exclui do Firestore
                    await db.collection('movimentacoes').doc(movimentacaoAtual.id).delete();
                    
                    // Exclui as fotos do Storage
                    const deletions = [];
                    if (movimentacaoAtual.fotoNotaUrl) {
                        const notaRef = storage.refFromURL(movimentacaoAtual.fotoNotaUrl);
                        deletions.push(notaRef.delete());
                    }
                    if (movimentacaoAtual.fotoMaterialUrl) {
                        const materialRef = storage.refFromURL(movimentacaoAtual.fotoMaterialUrl);
                        deletions.push(materialRef.delete());
                    }

                    await Promise.all(deletions);
                    showToast('Sucesso', 'Movimentação excluída com sucesso', 'success');
                    $('#confirmarExclusaoModal').modal('hide');
                    carregarMovimentacoes();

                } catch (error) {
                    showToast('Erro', 'Falha ao excluir: ' + error.message, 'danger');
                }
            });

            // Carrega a data atual
            $('#dataMovimentacao').val(new Date().toISOString().slice(0, 16));
        });

        // Função para carregar movimentações
        async function carregarMovimentacoes() {
            if (!currentUser) return;

            try {
                const snapshot = await db.collection('movimentacoes')
                    .orderBy('data', 'desc')
                    .get();

                const tbody = $('#materialTableBody');
                tbody.empty();

                if (snapshot.empty) {
                    tbody.append('<tr><td colspan="6" class="text-center">Nenhuma movimentação encontrada</td></tr>');
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dataFormatada = new Date(data.data?.toDate() || data.criadoEm).toLocaleString();
                    
                    tbody.append(`
                        <tr>
                            <td><span class="badge ${data.tipo === 'entrada' ? 'bg-success' : 'bg-danger'}">${data.tipo}</span></td>
                            <td>${dataFormatada}</td>
                            <td>${data.material}</td>
                            <td>${data.quantidade}</td>
                            <td>${data.responsavel}</td>
                            <td class="action-buttons">
                                <button class="btn btn-sm btn-info" onclick="verFotos('${doc.id}')">
                                    <i class="fas fa-image"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="prepararExclusao('${doc.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `);
                });
            } catch (error) {
                showToast('Erro', 'Falha ao carregar movimentações', 'danger');
            }
        }

        // Função para pré-visualizar imagens
        function previewImagem(file, seletor) {
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    $(seletor).html(`<img src="${e.target.result}" class="preview-image">`);
                };
                reader.readAsDataURL(file);
            } else {
                $(seletor).empty();
            }
        }

        // Funções globais para acesso nos botões
        window.verFotos = async function(id) {
            try {
                const doc = await db.collection('movimentacoes').doc(id).get();
                if (!doc.exists) return;

                const data = doc.data();
                
                // Foto da nota fiscal
                if (data.fotoNotaUrl) {
                    $('#modalFotoNota').attr('src', data.fotoNotaUrl);
                    $('#fotoNotaContainer').show();
                } else {
                    $('#fotoNotaContainer').hide();
                }
                
                // Foto do material
                if (data.fotoMaterialUrl) {
                    $('#modalFotoMaterial').attr('src', data.fotoMaterialUrl);
                    $('#fotoMaterialContainer').show();
                } else {
                    $('#fotoMaterialContainer').hide();
                }
                
                new bootstrap.Modal(document.getElementById('fotosModal')).show();
            } catch (error) {
                showToast('Erro', 'Não foi possível carregar as fotos', 'danger');
            }
        };

        window.prepararExclusao = async function(id) {
            try {
                const doc = await db.collection('movimentacoes').doc(id).get();
                if (!doc.exists) return;

                movimentacaoAtual = {
                    id: doc.id,
                    ...doc.data()
                };

                $('#senhaAdmin').val('');
                new bootstrap.Modal(document.getElementById('confirmarExclusaoModal')).show();
            } catch (error) {
                showToast('Erro', 'Falha ao preparar exclusão', 'danger');
            }
        };
    </script>
</body>
</html>
