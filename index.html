<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Entrada de Materiais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-entrada: #28a745;
            --color-primary: #0d6efd;
        }
        body { 
            padding-top: 20px; 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container { 
            max-width: 400px; 
            margin: 0 auto; 
            padding: 20px; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.1); 
        }
        .app-container { 
            display: none; 
        }
        .preview-image { 
            max-width: 100px; 
            max-height: 100px; 
            margin: 5px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
        }
        .btn-camera { 
            width: 100%; 
            padding: 10px; 
        }
        .toast-container { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1100; 
        }
        .modal-image { 
            max-width: 100%; 
            max-height: 70vh; 
            display: block;
            margin: 0 auto;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .action-buttons { 
            white-space: nowrap; 
        }
        #materialTable, #estoqueTable { 
            font-size: 14px; 
        }
        .table-responsive { 
            overflow-x: auto; 
        }
        .badge-entrada { 
            background-color: var(--color-entrada); 
        }
        .badge-primary { 
            background-color: var(--color-primary); 
        }
        .filter-section { 
            background-color: #f8f9fa; 
            padding: 15px; 
            border-radius: 5px; 
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            border-bottom: 3px solid var(--color-primary);
        }
        .card-header {
            font-weight: 600;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .loading-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            vertical-align: text-bottom;
            border: 0.25em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
        .material-details {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginContainer" class="container login-container">
        <div class="text-center mb-4">
            <i class="fas fa-boxes fa-3x mb-3" style="color: var(--color-primary);"></i>
            <h2>Controle de Materiais</h2>
        </div>
        <div id="loginAlert" class="alert alert-danger d-none"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
    </div>

    <!-- Aplicativo Principal -->
    <div id="appContainer" class="container app-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">
                <i class="fas fa-boxes me-2" style="color: var(--color-primary);"></i>
                Controle de Entrada de Materiais
            </h2>
            <button id="logoutBtn" class="btn btn-outline-danger">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>

        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="entrada-tab" data-bs-toggle="tab" data-bs-target="#entrada" type="button" role="tab">
                    <i class="fas fa-arrow-down me-1"></i> Nova Entrada
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="consulta-tab" data-bs-toggle="tab" data-bs-target="#consulta" type="button" role="tab">
                    <i class="fas fa-search me-1"></i> Consulta
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="estoque-tab" data-bs-toggle="tab" data-bs-target="#estoque" type="button" role="tab">
                    <i class="fas fa-boxes me-1"></i> Estoque
                </button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Aba de Entrada -->
            <div class="tab-pane fade show active" id="entrada" role="tabpanel">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-arrow-down me-1"></i> Registrar Entrada
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="entradaForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="responsavel" class="form-label">Responsável*</label>
                                    <input type="text" class="form-control" id="responsavel" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="material" class="form-label">Material*</label>
                                    <input type="text" class="form-control" id="material" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="quantidade" class="form-label">Quantidade*</label>
                                    <input type="number" class="form-control" id="quantidade" required min="1">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="notaFiscal" class="form-label">Número da Nota Fiscal</label>
                                    <input type="text" class="form-control" id="notaFiscal">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="estadoDestino" class="form-label">Estado de Destino*</label>
                                    <select class="form-select" id="estadoDestino" required>
                                        <option value="">Selecione um estado...</option>
                                        <!-- Estados serão preenchidos via JavaScript -->
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cidadeDestino" class="form-label">Cidade de Destino*</label>
                                    <select class="form-select" id="cidadeDestino" required disabled>
                                        <option value="">Selecione um estado primeiro...</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="prazoDias" class="form-label">Prazo (dias)</label>
                                    <input type="number" class="form-control" id="prazoDias" min="0" placeholder="Opcional">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dataEntrada" class="form-label">Data*</label>
                                    <input type="datetime-local" class="form-control" id="dataEntrada" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Foto da Nota Fiscal</label>
                                    <button type="button" class="btn btn-primary btn-camera" onclick="document.getElementById('fotoNota').click()">
                                        <i class="fas fa-camera me-1"></i> Capturar
                                    </button>
                                    <input type="file" id="fotoNota" accept="image/*" capture="environment" style="display:none;">
                                    <div id="previewNota" class="mt-2"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Foto do Material</label>
                                    <button type="button" class="btn btn-primary btn-camera" onclick="document.getElementById('fotoMaterial').click()">
                                        <i class="fas fa-camera me-1"></i> Capturar
                                    </button>
                                    <input type="file" id="fotoMaterial" accept="image/*" capture="environment" style="display:none;">
                                    <div id="previewMaterial" class="mt-2"></div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mt-3">
                                <i class="fas fa-save me-1"></i> Registrar Entrada
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Aba de Consulta -->
            <div class="tab-pane fade" id="consulta" role="tabpanel">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-1"></i> Consulta de Entradas
                        </h5>
                        <button class="btn btn-sm btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#filtrosCollapse">
                            <i class="fas fa-filter me-1"></i> Filtros
                        </button>
                    </div>
                    <div class="card-body">
                        <!-- Seção de Filtros -->
                        <div class="collapse show" id="filtrosCollapse">
                            <div class="filter-section">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label for="filtroMaterial" class="form-label">Material</label>
                                        <input type="text" class="form-control" id="filtroMaterial" placeholder="Pesquisar...">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="filtroResponsavel" class="form-label">Responsável</label>
                                        <input type="text" class="form-control" id="filtroResponsavel" placeholder="Pesquisar...">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="filtroNotaFiscal" class="form-label">Nota Fiscal</label>
                                        <input type="text" class="form-control" id="filtroNotaFiscal" placeholder="Pesquisar...">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="filtroDataInicio" class="form-label">Data Início</label>
                                        <input type="date" class="form-control" id="filtroDataInicio">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="filtroDataFim" class="form-label">Data Fim</label>
                                        <input type="date" class="form-control" id="filtroDataFim">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="filtroDestino" class="form-label">Destino</label>
                                        <input type="text" class="form-control" id="filtroDestino" placeholder="Pesquisar...">
                                    </div>
                                    <div class="col-md-6 d-flex align-items-end">
                                        <button id="aplicarFiltros" class="btn btn-primary w-100">
                                            <i class="fas fa-search me-1"></i> Aplicar
                                        </button>
                                    </div>
                                    <div class="col-md-6 d-flex align-items-end">
                                        <button id="limparFiltros" class="btn btn-secondary w-100">
                                            <i class="fas fa-broom me-1"></i> Limpar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tabela de Resultados -->
                        <div class="table-responsive mt-3">
                            <table class="table table-striped table-hover" id="materialTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Data</th>
                                        <th>Material</th>
                                        <th>Qtd</th>
                                        <th>Responsável</th>
                                        <th>Nota Fiscal</th>
                                        <th>Destino</th>
                                        <th>Prazo</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="materialTableBody">
                                    <!-- Dados serão carregados aqui -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Aba de Estoque -->
            <div class="tab-pane fade" id="estoque" role="tabpanel">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-boxes me-1"></i> Estoque de Materiais
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Tabela de Estoque -->
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="estoqueTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Material</th>
                                        <th>Quantidade</th>
                                        <th>Última Entrada</th>
                                        <th>Destino</th>
                                    </tr>
                                </thead>
                                <tbody id="estoqueTableBody">
                                    <!-- Dados serão carregados aqui -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Visualizar Fotos -->
    <div class="modal fade" id="fotosModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-images me-1"></i> Fotos da Entrada
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3" id="fotoNotaContainer">
                            <h6 class="text-center fw-bold">
                                <i class="fas fa-file-invoice me-1"></i> Nota Fiscal
                            </h6>
                            <img id="modalFotoNota" class="modal-image img-thumbnail" src="" alt="Foto da Nota Fiscal">
                        </div>
                        <div class="col-md-6 mb-3" id="fotoMaterialContainer">
                            <h6 class="text-center fw-bold">
                                <i class="fas fa-box-open me-1"></i> Material
                            </h6>
                            <img id="modalFotoMaterial" class="modal-image img-thumbnail" src="" alt="Foto do Material">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i> Fechar
                    </button>
                    <button type="button" class="btn btn-primary" onclick="salvarFotosDoModal()">
                        <i class="fas fa-download me-1"></i> Salvar Fotos
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">
                    <i class="fas fa-info-circle me-1"></i> Notificação
                </strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBm0t_SQ1vyq2fW3aFqgKph-NB9BwCq60Y",
            authDomain: "controle-materiais-v2.firebaseapp.com",
            projectId: "controle-materiais-v2",
            storageBucket: "controle-materiais-v2.appspot.com",
            messagingSenderId: "1059762022447",
            appId: "1:1059762022447:web:a977debad4cbc9ae313eda"
        };

        // Inicialização do Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Variáveis globais
        let currentUser = null;
        let fotoNotaFile = null;
        let fotoMaterialFile = null;
        let todasEntradas = [];
        let estoque = {};

        $(document).ready(function() {
            // Configuração do Toast
            const toastEl = document.getElementById('liveToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });

            function showToast(title, message, type = 'success') {
                $('#toastTitle').html(`<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-1"></i> ${title}`);
                $('#toastMessage').text(message);
                $('.toast-header').removeClass('bg-success bg-danger bg-warning').addClass(`bg-${type}`);
                toast.show();
            }

            // Lista de estados brasileiros com siglas
            const estadosBrasileiros = [
                { nome: "Acre", sigla: "AC" },
                { nome: "Alagoas", sigla: "AL" },
                { nome: "Amapá", sigla: "AP" },
                { nome: "Amazonas", sigla: "AM" },
                { nome: "Bahia", sigla: "BA" },
                { nome: "Ceará", sigla: "CE" },
                { nome: "Distrito Federal", sigla: "DF" },
                { nome: "Espírito Santo", sigla: "ES" },
                { nome: "Goiás", sigla: "GO" },
                { nome: "Maranhão", sigla: "MA" },
                { nome: "Mato Grosso", sigla: "MT" },
                { nome: "Mato Grosso do Sul", sigla: "MS" },
                { nome: "Minas Gerais", sigla: "MG" },
                { nome: "Pará", sigla: "PA" },
                { nome: "Paraíba", sigla: "PB" },
                { nome: "Paraná", sigla: "PR" },
                { nome: "Pernambuco", sigla: "PE" },
                { nome: "Piauí", sigla: "PI" },
                { nome: "Rio de Janeiro", sigla: "RJ" },
                { nome: "Rio Grande do Norte", sigla: "RN" },
                { nome: "Rio Grande do Sul", sigla: "RS" },
                { nome: "Rondônia", sigla: "RO" },
                { nome: "Roraima", sigla: "RR" },
                { nome: "Santa Catarina", sigla: "SC" },
                { nome: "São Paulo", sigla: "SP" },
                { nome: "Sergipe", sigla: "SE" },
                { nome: "Tocantins", sigla: "TO" }
            ];

            // Carregar estados brasileiros
            function carregarEstados() {
                const selectEstadoDestino = $('#estadoDestino');
                estadosBrasileiros.forEach(estado => {
                    selectEstadoDestino.append(`<option value="${estado.sigla}">${estado.nome} (${estado.sigla})</option>`);
                });
                
                $('#estadoDestino').change(function() {
                    const siglaEstado = $(this).val();
                    carregarCidades(siglaEstado, '#cidadeDestino');
                });
            }

            // Carregar cidades de um estado específico (simplificado)
            function carregarCidades(siglaEstado, seletorCidade) {
                if (!siglaEstado) {
                    $(seletorCidade).empty().append('<option value="">Selecione um estado primeiro...</option>').prop('disabled', true);
                    return;
                }
                
                $(seletorCidade).empty().append('<option value="">Carregando cidades...</option>').prop('disabled', true);
                
                setTimeout(() => {
                    const cidadesExemplo = ["Capital", "Cidade 1", "Cidade 2", "Cidade 3"];
                    const select = $(seletorCidade);
                    select.empty();
                    
                    cidadesExemplo.forEach(cidade => {
                        select.append(`<option value="${cidade}">${cidade}</option>`);
                    });
                    
                    select.prop('disabled', false);
                }, 500);
            }

            // Verificação de autenticação
            auth.onAuthStateChanged(user => {
                currentUser = user;
                if (user) {
                    $('#loginContainer').hide();
                    $('#appContainer').show();
                    carregarEstados();
                    carregarEntradas();
                } else {
                    $('#loginContainer').show();
                    $('#appContainer').hide();
                }
            });

            // Login
            $('#loginForm').submit(function(e) {
                e.preventDefault();
                const email = $('#email').val();
                const password = $('#password').val();
                
                auth.signInWithEmailAndPassword(email, password)
                    .catch(error => {
                        $('#loginAlert').removeClass('d-none').text(error.message);
                    });
            });

            // Logout
            $('#logoutBtn').click(function() {
                auth.signOut();
            });

            // Configuração dos inputs de foto
            $('#fotoNota').change(function(e) {
                fotoNotaFile = e.target.files[0];
                previewImagem(fotoNotaFile, '#previewNota');
                salvarFotoNoDispositivo(fotoNotaFile, 'nota_fiscal_' + new Date().getTime() + '.jpg');
            });

            $('#fotoMaterial').change(function(e) {
                fotoMaterialFile = e.target.files[0];
                previewImagem(fotoMaterialFile, '#previewMaterial');
                salvarFotoNoDispositivo(fotoMaterialFile, 'material_' + new Date().getTime() + '.jpg');
            });

            // Formulário de entrada
            $('#entradaForm').submit(async function(e) {
                e.preventDefault();
                
                if (!currentUser) {
                    showToast('Erro', 'Faça login antes de continuar', 'danger');
                    return;
                }

                const responsavel = $('#responsavel').val();
                const material = $('#material').val();
                const quantidade = $('#quantidade').val();
                const notaFiscal = $('#notaFiscal').val();
                const estadoDestino = $('#estadoDestino').val();
                const cidadeDestino = $('#cidadeDestino').val();
                const prazoDias = $('#prazoDias').val();
                const dataEntrada = $('#dataEntrada').val();

                // Validação
                if (!responsavel || !material || !quantidade || !dataEntrada || !estadoDestino || !cidadeDestino) {
                    showToast('Atenção', 'Preencha todos os campos obrigatórios', 'warning');
                    return;
                }

                try {
                    $('#entradaForm button[type="submit"]').html('<span class="loading-spinner"></span> Salvando...').prop('disabled', true);
                    
                    const destino = `${cidadeDestino}/${estadoDestino}`;
                    
                    const docRef = await db.collection('entradas').add({
                        responsavel,
                        material,
                        quantidade: parseInt(quantidade),
                        notaFiscal: notaFiscal || null,
                        destino,
                        prazoDias: prazoDias ? parseInt(prazoDias) : null,
                        data: firebase.firestore.FieldValue.serverTimestamp(),
                        usuario: currentUser.email,
                        criadoEm: new Date().toISOString()
                    });

                    // Upload das fotos
                    const uploadTasks = [];
                    if (fotoNotaFile) {
                        const notaRef = storage.ref(`notas_fiscais/${docRef.id}/${fotoNotaFile.name}`);
                        uploadTasks.push(notaRef.put(fotoNotaFile).then(snapshot => snapshot.ref.getDownloadURL()));
                    }
                    
                    if (fotoMaterialFile) {
                        const materialRef = storage.ref(`materiais/${docRef.id}/${fotoMaterialFile.name}`);
                        uploadTasks.push(materialRef.put(fotoMaterialFile).then(snapshot => snapshot.ref.getDownloadURL()));
                    }

                    const [fotoNotaUrl, fotoMaterialUrl] = await Promise.all(uploadTasks);
                    const updateData = {};
                    if (fotoNotaUrl) updateData.fotoNotaUrl = fotoNotaUrl;
                    if (fotoMaterialUrl) updateData.fotoMaterialUrl = fotoMaterialUrl;
                    
                    if (Object.keys(updateData).length > 0) {
                        await docRef.update(updateData);
                    }

                    showToast('Sucesso', 'Entrada registrada com sucesso!', 'success');
                    
                    // Limpar formulário
                    $('#entradaForm')[0].reset();
                    $('#previewNota, #previewMaterial').empty();
                    $('#cidadeDestino').empty().append('<option value="">Selecione um estado primeiro...</option>').prop('disabled', true);
                    fotoNotaFile = fotoMaterialFile = null;
                    
                    carregarEntradas();
                    
                } catch (error) {
                    showToast('Erro', 'Falha ao registrar entrada: ' + error.message, 'danger');
                } finally {
                    $('#entradaForm button[type="submit"]').html('<i class="fas fa-save me-1"></i> Registrar Entrada').prop('disabled', false);
                }
            });

            // Event Listeners para filtros
            $('#aplicarFiltros').click(aplicarFiltros);
            $('#limparFiltros').click(function() {
                $('#filtroMaterial, #filtroResponsavel, #filtroNotaFiscal, #filtroDataInicio, #filtroDataFim, #filtroDestino').val('');
                aplicarFiltros();
            });

            // Carrega a data atual
            const now = new Date();
            const timezoneOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - timezoneOffset).toISOString().slice(0, 16);
            $('#dataEntrada').val(localISOTime);
        });

        // Função para carregar entradas
        async function carregarEntradas() {
            try {
                showLoading(true);
                
                const snapshot = await db.collection('entradas')
                    .orderBy('data', 'desc')
                    .get();

                todasEntradas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    todasEntradas.push(data);
                });

                calcularEstoque();
                aplicarFiltros();
                atualizarTabelaEstoque();
            } catch (error) {
                showToast('Erro', 'Falha ao carregar entradas: ' + error.message, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Função para calcular o estoque
        function calcularEstoque() {
            estoque = {};
            
            todasEntradas.forEach(entrada => {
                if (!estoque[entrada.material]) {
                    estoque[entrada.material] = {
                        quantidade: 0,
                        ultimaEntrada: null,
                        destino: entrada.destino
                    };
                }
                
                estoque[entrada.material].quantidade += parseInt(entrada.quantidade);
                
                const dataEntrada = entrada.data?.toDate() || new Date(entrada.criadoEm);
                if (!estoque[entrada.material].ultimaEntrada || 
                    dataEntrada > estoque[entrada.material].ultimaEntrada.data) {
                    estoque[entrada.material].ultimaEntrada = {
                        data: dataEntrada,
                        destino: entrada.destino
                    };
                }
            });
        }

        // Função para aplicar filtros
        function aplicarFiltros() {
            const material = $('#filtroMaterial').val().toLowerCase();
            const responsavel = $('#filtroResponsavel').val().toLowerCase();
            const notaFiscal = $('#filtroNotaFiscal').val().toLowerCase();
            const dataInicio = $('#filtroDataInicio').val();
            const dataFim = $('#filtroDataFim').val();
            const destino = $('#filtroDestino').val().toLowerCase();

            const resultados = todasEntradas.filter(entrada => {
                if (material && !entrada.material.toLowerCase().includes(material)) return false;
                if (responsavel && !entrada.responsavel.toLowerCase().includes(responsavel)) return false;
                if (notaFiscal && (!entrada.notaFiscal || !entrada.notaFiscal.toLowerCase().includes(notaFiscal))) return false;
                if (destino && !entrada.destino.toLowerCase().includes(destino)) return false;
                
                const dataEntrada = entrada.data?.toDate() || new Date(entrada.criadoEm);
                if (dataInicio && new Date(dataInicio) > dataEntrada) return false;
                if (dataFim) {
                    const fim = new Date(dataFim);
                    fim.setDate(fim.getDate() + 1);
                    if (fim < dataEntrada) return false;
                }
                
                return true;
            });

            exibirResultados(resultados);
        }

        // Função para exibir resultados na tabela
        function exibirResultados(dados) {
            const tbody = $('#materialTableBody');
            tbody.empty();

            if (dados.length === 0) {
                tbody.append('<tr><td colspan="8" class="text-center py-4 text-muted">Nenhuma entrada encontrada</td></tr>');
                return;
            }

            dados.forEach(entrada => {
                const dataFormatada = formatarData(entrada.data?.toDate() || new Date(entrada.criadoEm));
                const prazoInfo = entrada.prazoDias ? 
                    `<span class="badge badge-primary">${entrada.prazoDias} dias</span>` : 
                    '<span class="text-muted">Sem prazo</span>';
                
                tbody.append(`
                    <tr>
                        <td>${dataFormatada}</td>
                        <td>${entrada.material}</td>
                        <td>${entrada.quantidade}</td>
                        <td>${entrada.responsavel}</td>
                        <td>${entrada.notaFiscal || '-'}</td>
                        <td>${entrada.destino}</td>
                        <td>${prazoInfo}</td>
                        <td class="action-buttons">
                            <button class="btn btn-sm btn-info" onclick="verFotosCompletas('${entrada.id}')" title="Ver Fotos" data-bs-toggle="tooltip">
                                <i class="fas fa-images"></i>
                            </button>
                        </td>
                    </tr>
                `);
            });

            $('[data-bs-toggle="tooltip"]').tooltip();
        }

        // Atualiza tabela de estoque
        function atualizarTabelaEstoque() {
            const tbody = $('#estoqueTableBody');
            tbody.empty();

            if (Object.keys(estoque).length === 0) {
                tbody.append('<tr><td colspan="4" class="text-center py-4 text-muted">Nenhum material em estoque</td></tr>');
                return;
            }

            Object.keys(estoque).forEach(material => {
                const info = estoque[material];
                const ultimaEntrada = info.ultimaEntrada ? 
                    formatarData(info.ultimaEntrada.data) : 'N/A';
                
                tbody.append(`
                    <tr>
                        <td>${material}</td>
                        <td>${info.quantidade}</td>
                        <td>${ultimaEntrada}</td>
                        <td>${info.destino}</td>
                    </tr>
                `);
            });
        }

        // Função para formatar data
        function formatarData(data) {
            const options = { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            };
            return data.toLocaleDateString('pt-BR', options);
        }

        // Função para mostrar loading
        function showLoading(show) {
            const tbody = $('#materialTableBody');
            if (show) {
                tbody.html('<tr><td colspan="8" class="text-center py-4"><div class="loading-spinner text-primary"></div> <span class="ms-2">Carregando...</span></td></tr>');
            }
        }

        // Função para pré-visualizar imagens
        function previewImagem(file, seletor) {
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    $(seletor).html(`<img src="${e.target.result}" class="preview-image">`);
                };
                reader.readAsDataURL(file);
            } else {
                $(seletor).empty();
            }
        }

        // Função para salvar fotos no dispositivo
        async function salvarFotoNoDispositivo(file, filename) {
            try {
                if (!file) return;
                
                const imageUrl = URL.createObjectURL(file);
                const link = document.createElement('a');
                link.href = imageUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(imageUrl);
                
                console.log('Foto salva:', filename);
            } catch (error) {
                console.error('Erro ao salvar foto:', error);
            }
        }

        // Função para salvar fotos do modal
        window.salvarFotosDoModal = function() {
            try {
                const notaUrl = $('#modalFotoNota').attr('src');
                const materialUrl = $('#modalFotoMaterial').attr('src');
                
                if (notaUrl) {
                    const link = document.createElement('a');
                    link.href = notaUrl;
                    link.download = 'nota_fiscal_' + new Date().getTime() + '.jpg';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
                
                if (materialUrl) {
                    const link = document.createElement('a');
                    link.href = materialUrl;
                    link.download = 'material_' + new Date().getTime() + '.jpg';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
                
                showToast('Sucesso', 'Fotos salvas com sucesso na galeria do dispositivo', 'success');
            } catch (error) {
                showToast('Erro', 'Não foi possível salvar as fotos: ' + error.message, 'danger');
            }
        };

        // Função para ver fotos completas
        window.verFotosCompletas = async function(id) {
            try {
                showLoading(true);
                const doc = await db.collection('entradas').doc(id).get();
                if (!doc.exists) return;

                const data = doc.data();
                const modal = new bootstrap.Modal(document.getElementById('fotosModal'));
                
                // Foto da nota fiscal
                const notaContainer = $('#fotoNotaContainer');
                const notaImg = $('#modalFotoNota');
                if (data.fotoNotaUrl) {
                    notaImg.attr('src', data.fotoNotaUrl);
                    notaContainer.show();
                } else {
                    notaContainer.hide();
                }
                
                // Foto do material
                const materialContainer = $('#fotoMaterialContainer');
                const materialImg = $('#modalFotoMaterial');
                if (data.fotoMaterialUrl) {
                    materialImg.attr('src', data.fotoMaterialUrl);
                    materialContainer.show();
                } else {
                    materialContainer.hide();
                }
                
                modal.show();
            } catch (error) {
                showToast('Erro', 'Não foi possível carregar as fotos', 'danger');
            } finally {
                showLoading(false);
            }
        };
    </script>
</body>
