<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Materiais v2 - Nota Fiscal e Destino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-section {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        select {
            height: 40px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #f44336;
        }
        button.secondary:hover {
            background-color: #d32f2f;
        }
        .camera-container {
            margin: 20px 0;
            text-align: center;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border: 1px dashed #ccc;
        }
        #video {
            background-color: #eee;
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin-bottom: 10px;
        }
        #canvas {
            display: none;
        }
        #photo {
            max-width: 100%;
            max-height: 300px;
            margin-top: 10px;
            border: 1px solid #ddd;
        }
        .material-list {
            margin-top: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .filter-section {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #f2f2f2;
            border-radius: 5px;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .photo-thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 90%;
            max-width: 800px;
            margin-top: 50px;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .required-field::after {
            content: " *";
            color: red;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Controle de Materiais com Nota Fiscal e Destino</h1>
        
        <!-- Formulário de Entrada/Saída -->
        <div class="form-section">
            <h2>Registro de Material</h2>
            <form id="materialForm">
                <div class="two-columns">
                    <div class="form-group">
                        <label for="operationType" class="required-field">Tipo de Operação:</label>
                        <select id="operationType" required>
                            <option value="">Selecione...</option>
                            <option value="entrada">Entrada (Nota Fiscal)</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="invoiceNumber" class="required-field">Número da Nota Fiscal:</label>
                        <input type="text" id="invoiceNumber" required>
                    </div>
                </div>
                
                <div class="two-columns">
                    <div class="form-group">
                        <label for="materialName" class="required-field">Nome do Material:</label>
                        <input type="text" id="materialName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="materialQuantity" class="required-field">Quantidade:</label>
                        <input type="number" id="materialQuantity" min="1" value="1" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="materialDescription">Descrição:</label>
                    <textarea id="materialDescription" rows="3"></textarea>
                </div>
                
                <div class="two-columns">
                    <div class="form-group">
                        <label for="materialDate" class="required-field">Data:</label>
                        <input type="datetime-local" id="materialDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="materialResponsible" class="required-field">Responsável:</label>
                        <input type="text" id="materialResponsible" required>
                    </div>
                </div>
                
                <div class="two-columns">
                    <div class="form-group">
                        <label for="materialOrigin" class="required-field">Origem/Fornecedor:</label>
                        <input type="text" id="materialOrigin" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="materialDestination" class="required-field">Destino:</label>
                        <input type="text" id="materialDestination" required>
                    </div>
                </div>
                
                <div class="camera-container">
                    <label>Foto da Nota Fiscal/Material:</label>
                    <div>
                        <video id="video" autoplay></video>
                        <canvas id="canvas"></canvas>
                        <div class="actions">
                            <button type="button" id="startCamera">Iniciar Câmera</button>
                            <button type="button" id="takePhoto">Tirar Foto</button>
                            <button type="button" id="clearPhoto" class="secondary">Limpar Foto</button>
                        </div>
                    </div>
                    <img id="photo" alt="Foto da nota fiscal/material">
                    <input type="hidden" id="photoData">
                </div>
                
                <div class="actions">
                    <button type="submit">Registrar</button>
                    <button type="reset" class="secondary">Limpar Formulário</button>
                </div>
            </form>
        </div>
        
        <!-- Filtros de Busca -->
        <div class="filter-section">
            <h2>Filtrar Materiais</h2>
            <form id="filterForm">
                <div class="two-columns">
                    <div class="form-group">
                        <label for="filterOperation">Tipo de Operação:</label>
                        <select id="filterOperation">
                            <option value="">Todos</option>
                            <option value="entrada">Entrada (Nota Fiscal)</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="filterInvoice">Número da Nota Fiscal:</label>
                        <input type="text" id="filterInvoice">
                    </div>
                </div>
                
                <div class="two-columns">
                    <div class="form-group">
                        <label for="filterName">Nome do Material:</label>
                        <input type="text" id="filterName">
                    </div>
                    
                    <div class="form-group">
                        <label for="filterResponsible">Responsável:</label>
                        <input type="text" id="filterResponsible">
                    </div>
                </div>
                
                <div class="two-columns">
                    <div class="form-group">
                        <label for="filterOrigin">Origem/Fornecedor:</label>
                        <input type="text" id="filterOrigin">
                    </div>
                    
                    <div class="form-group">
                        <label for="filterDestination">Destino:</label>
                        <input type="text" id="filterDestination">
                    </div>
                </div>
                
                <div class="two-columns">
                    <div class="form-group">
                        <label for="filterDateFrom">Data de:</label>
                        <input type="date" id="filterDateFrom">
                    </div>
                    
                    <div class="form-group">
                        <label for="filterDateTo">Até:</label>
                        <input type="date" id="filterDateTo">
                    </div>
                </div>
                
                <div class="actions">
                    <button type="button" id="applyFilter">Aplicar Filtro</button>
                    <button type="reset" class="secondary">Limpar Filtros</button>
                </div>
            </form>
        </div>
        
        <!-- Lista de Materiais -->
        <div class="material-list">
            <h2>Registros de Materiais</h2>
            <table id="materialsTable">
                <thead>
                    <tr>
                        <th>Operação</th>
                        <th>Nota Fiscal</th>
                        <th>Material</th>
                        <th>Qtd</th>
                        <th>Data</th>
                        <th>Responsável</th>
                        <th>Origem</th>
                        <th>Destino</th>
                        <th>Foto</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="materialsTableBody">
                    <!-- Dados serão inseridos aqui via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Modal para visualização da foto -->
    <div id="photoModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalPhoto">
    </div>
    
    <script>
        // Variáveis globais
        let materials = JSON.parse(localStorage.getItem('materials')) || [];
        let stream = null;
        
        // Elementos do DOM
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const photoData = document.getElementById('photoData');
        const startCameraBtn = document.getElementById('startCamera');
        const takePhotoBtn = document.getElementById('takePhoto');
        const clearPhotoBtn = document.getElementById('clearPhoto');
        const materialForm = document.getElementById('materialForm');
        const filterForm = document.getElementById('filterForm');
        const applyFilterBtn = document.getElementById('applyFilter');
        const materialsTableBody = document.getElementById('materialsTableBody');
        const photoModal = document.getElementById('photoModal');
        const modalPhoto = document.getElementById('modalPhoto');
        const closeModal = document.getElementsByClassName('close')[0];
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Definir data/hora atual como padrão
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('materialDate').value = localDateTime;
            
            // Carregar materiais
            renderMaterialsTable();
        });
        
        startCameraBtn.addEventListener('click', startCamera);
        takePhotoBtn.addEventListener('click', takePhoto);
        clearPhotoBtn.addEventListener('click', clearPhoto);
        materialForm.addEventListener('submit', handleFormSubmit);
        applyFilterBtn.addEventListener('click', renderMaterialsTable);
        closeModal.addEventListener('click', () => photoModal.style.display = "none");
        
        // Funções
        function startCamera() {
            if (stream) {
                stopCamera();
                return;
            }
            
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(mediaStream) {
                    stream = mediaStream;
                    video.srcObject = stream;
                    startCameraBtn.textContent = 'Parar Câmera';
                    takePhotoBtn.disabled = false;
                })
                .catch(function(err) {
                    console.error("Erro ao acessar a câmera: ", err);
                    alert("Não foi possível acessar a câmera. Verifique as permissões.");
                });
        }
        
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
                startCameraBtn.textContent = 'Iniciar Câmera';
                takePhotoBtn.disabled = true;
            }
        }
        
        function takePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/png');
            photo.src = dataUrl;
            photoData.value = dataUrl;
            
            stopCamera();
        }
        
        function clearPhoto() {
            photo.src = '';
            photoData.value = '';
        }
        
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const material = {
                id: Date.now(),
                operationType: document.getElementById('operationType').value,
                invoiceNumber: document.getElementById('invoiceNumber').value,
                name: document.getElementById('materialName').value,
                description: document.getElementById('materialDescription').value,
                quantity: parseInt(document.getElementById('materialQuantity').value),
                date: document.getElementById('materialDate').value,
                responsible: document.getElementById('materialResponsible').value,
                origin: document.getElementById('materialOrigin').value,
                destination: document.getElementById('materialDestination').value,
                photo: document.getElementById('photoData').value,
                timestamp: new Date().getTime()
            };
            
            materials.push(material);
            saveMaterials();
            renderMaterialsTable();
            materialForm.reset();
            clearPhoto();
            
            // Resetar data/hora para atual
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('materialDate').value = localDateTime;
            
            alert('Material registrado com sucesso!');
        }
        
        function saveMaterials() {
            localStorage.setItem('materials', JSON.stringify(materials));
        }
        
        function renderMaterialsTable() {
            // Obter valores dos filtros
            const operationFilter = document.getElementById('filterOperation').value;
            const invoiceFilter = document.getElementById('filterInvoice').value.toLowerCase();
            const nameFilter = document.getElementById('filterName').value.toLowerCase();
            const responsibleFilter = document.getElementById('filterResponsible').value.toLowerCase();
            const originFilter = document.getElementById('filterOrigin').value.toLowerCase();
            const destinationFilter = document.getElementById('filterDestination').value.toLowerCase();
            const dateFromFilter = document.getElementById('filterDateFrom').value;
            const dateToFilter = document.getElementById('filterDateTo').value;
            
            // Filtrar materiais
            let filteredMaterials = materials.filter(material => {
                // Filtro por tipo de operação
                if (operationFilter && material.operationType !== operationFilter) {
                    return false;
                }
                
                // Filtro por nota fiscal
                if (invoiceFilter && !material.invoiceNumber.toLowerCase().includes(invoiceFilter)) {
                    return false;
                }
                
                // Filtro por nome
                if (nameFilter && !material.name.toLowerCase().includes(nameFilter)) {
                    return false;
                }
                
                // Filtro por responsável
                if (responsibleFilter && !material.responsible.toLowerCase().includes(responsibleFilter)) {
                    return false;
                }
                
                // Filtro por origem
                if (originFilter && !material.origin.toLowerCase().includes(originFilter)) {
                    return false;
                }
                
                // Filtro por destino
                if (destinationFilter && !material.destination.toLowerCase().includes(destinationFilter)) {
                    return false;
                }
                
                // Filtro por data
                const materialDate = new Date(material.date).toISOString().split('T')[0];
                
                if (dateFromFilter && materialDate < dateFromFilter) {
                    return false;
                }
                
                if (dateToFilter && materialDate > dateToFilter) {
                    return false;
                }
                
                return true;
            });
            
            // Ordenar por data (mais recente primeiro)
            filteredMaterials.sort((a, b) => b.timestamp - a.timestamp);
            
            // Renderizar tabela
            materialsTableBody.innerHTML = '';
            
            if (filteredMaterials.length === 0) {
                materialsTableBody.innerHTML = '<tr><td colspan="10" style="text-align: center;">Nenhum material encontrado</td></tr>';
                return;
            }
            
            filteredMaterials.forEach(material => {
                const row = document.createElement('tr');
                
                // Formatar data para exibição
                const formattedDate = new Date(material.date).toLocaleString('pt-BR');
                
                // Criar miniatura da foto ou placeholder
                let photoCell = 'Sem foto';
                if (material.photo) {
                    photoCell = `<img src="${material.photo}" class="photo-thumbnail" onclick="showPhotoModal('${material.photo}')">`;
                }
                
                row.innerHTML = `
                    <td>${material.operationType === 'entrada' ? 'Entrada' : 'Saída'}</td>
                    <td>${material.invoiceNumber}</td>
                    <td>${material.name}</td>
                    <td>${material.quantity}</td>
                    <td>${formattedDate}</td>
                    <td>${material.responsible}</td>
                    <td>${material.origin}</td>
                    <td>${material.destination}</td>
                    <td>${photoCell}</td>
                    <td>
                        <button onclick="deleteMaterial(${material.id})" class="secondary">Excluir</button>
                    </td>
                `;
                
                materialsTableBody.appendChild(row);
            });
        }
        
        function deleteMaterial(id) {
            if (confirm('Tem certeza que deseja excluir este registro?')) {
                materials = materials.filter(material => material.id !== id);
                saveMaterials();
                renderMaterialsTable();
            }
        }
        
        function showPhotoModal(photoSrc) {
            modalPhoto.src = photoSrc;
            photoModal.style.display = "block";
        }
        
        // Fechar modal ao clicar fora da imagem
        window.onclick = function(event) {
            if (event.target == photoModal) {
                photoModal.style.display = "none";
            }
        }
    </script>
</body>
</html>
